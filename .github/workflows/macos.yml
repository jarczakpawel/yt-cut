name: macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Intel
          - runner: macos-15-arm64
            arch: AppleSilicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: |
          python -m pip install --disable-pip-version-check PySide6==6.10.0 pyinstaller==6.16.0 Pillow==11.3.0
          brew install ffmpeg yt-dlp node
      - name: Verify local media import and export
        run: python yt-cut-windows.py --local-check
      - name: Create application icon
        run: python tools/create_icon.py
      - name: Build macOS application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name YT-Cut --osx-bundle-identifier com.jarczakpawel.ytcut \
            --icon assets/yt-cut.png \
            --collect-all PySide6.QtMultimedia \
            yt-cut-windows.py
      - name: Verify app bundle
        run: |
          test -x dist/YT-Cut.app/Contents/MacOS/YT-Cut
          dist/YT-Cut.app/Contents/MacOS/YT-Cut --local-check
          codesign --verify --deep dist/YT-Cut.app
      - name: Create ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/YT-Cut.app YT-Cut-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Cut-macOS-${{ matrix.arch }}
          path: YT-Cut-macOS-${{ matrix.arch }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: YT-Cut-macOS-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: YT-Cut-macOS-*.zip
          fail_on_unmatched_files: true
