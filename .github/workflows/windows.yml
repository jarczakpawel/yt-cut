name: Windows portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PySide6==6.10.0 pyinstaller==6.16.0 Pillow==11.3.0 "cmake>=4.2,<4.3"
      - name: Download and bundle media tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools-bin | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          Copy-Item $ffmpeg.FullName tools-bin\ffmpeg.exe
          Copy-Item (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe') tools-bin\ffprobe.exe
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile tools-bin\yt-dlp.exe
          Copy-Item (Get-Command node.exe).Source tools-bin\node.exe
          $mpvUri = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261102/mpv-dev-x86_64-20261102-git-2137d21b2e.7z'
          $mpvArchive = "$env:RUNNER_TEMP\mpv-dev.7z"
          Invoke-WebRequest -Uri $mpvUri -OutFile $mpvArchive
          $mpvHash = (Get-FileHash $mpvArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mpvHash -ne '5ca801552661c18fa0b1edfd41dba6e5d9aa9d6d3d6c42dbe3fb91a45eb79f16') { throw "libmpv archive checksum mismatch: $mpvHash" }
          & 'C:\Program Files\7-Zip\7z.exe' e -y "-o$env:RUNNER_TEMP\mpv-dev" $mpvArchive libmpv-2.dll
          if ($LASTEXITCODE -ne 0) { throw 'Extracting libmpv failed' }
          Copy-Item "$env:RUNNER_TEMP\mpv-dev\libmpv-2.dll" tools-bin\libmpv-2.dll
          python tools/build_vulkan_loader.py tools-bin/vulkan-1.dll tools-bin/libmpv-2.dll
          if ($LASTEXITCODE -ne 0) { throw "Vulkan Loader build failed" }
          & tools-bin\ffmpeg.exe -version | Select-Object -First 1
          & tools-bin\ffprobe.exe -version | Select-Object -First 1
          & tools-bin\yt-dlp.exe --version
          & tools-bin\node.exe --version
      - name: Generate Windows icon
        run: python tools/create_icon.py
      - name: Bundle self-contained application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name YT-Cut --icon assets/yt-cut.ico --add-binary 'tools-bin/ffmpeg.exe;tools' --add-binary 'tools-bin/ffprobe.exe;tools' --add-binary 'tools-bin/yt-dlp.exe;tools' --add-binary 'tools-bin/node.exe;tools' --add-binary 'tools-bin/libmpv-2.dll;tools' --add-binary 'tools-bin/vulkan-1.dll;tools' yt-cut-windows.py
      - name: Verify packaged executables
        shell: pwsh
        run: |
          $root = 'dist\YT-Cut'
          foreach ($name in @('ffmpeg.exe','ffprobe.exe','yt-dlp.exe','node.exe','libmpv-2.dll','vulkan-1.dll')) {
            if (-not (Test-Path "$root\_internal\tools\$name")) { throw "Missing bundled tool: $name" }
          }
          $result = Start-Process -FilePath (Resolve-Path "$root\YT-Cut.exe").Path -ArgumentList "--self-check" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Windows self-check returned $($result.ExitCode)" }
          $media = Start-Process -FilePath (Resolve-Path "$root\\YT-Cut.exe").Path -ArgumentList "--media-check" -Wait -PassThru -WorkingDirectory (Resolve-Path $root).Path
          Get-Content "$root\\media-check.log"
          if ($media.ExitCode -ne 0) { throw "Windows media decoding and export check returned $($media.ExitCode)" }
          Remove-Item "$root\media-check.log"
          $download = Start-Process -FilePath (Resolve-Path "$root\YT-Cut.exe").Path -ArgumentList "--download-check" -Wait -PassThru -WorkingDirectory (Resolve-Path $root).Path
          Get-Content "$root\download-check.log"
          if ($download.ExitCode -ne 0) { throw "Windows download and MP4/MP3/WAV export check returned $($download.ExitCode)" }
          Remove-Item "$root\download-check.log"
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\YT-Cut -DestinationPath YT-Cut-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Cut-Windows-x64
          path: YT-Cut-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YT Cut ${{ github.ref_name }}
          generate_release_notes: true
          files: YT-Cut-Windows-x64.zip
          fail_on_unmatched_files: true
